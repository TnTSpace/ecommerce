version: "3.8"
services:
  ecommerce:
    image: toolsntuts/ecommerce:1.2.1
    restart: always
    ports:
      - "3000"
    networks:
      - dokploy-network
    environment:
      # Server config
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - ORIGIN=https://laniastores.toolsntuts.com
      
      # Better Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://laniastores.toolsntuts.com
      - BETTER_API_URL=https://laniastores.toolsntuts.com/api/auth
      
      # DATABASE — Connect using EC2 public IP and exposed PostgreSQL port
      # DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@3.142.55.22:6543/postgres
      - DATABASE_URL=${DATABASE_URL}
      
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      
      # MinIO
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_BUCKET=${MINIO_BUCKET}

      # Paystack
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      
      # N8N
      - EMAIL_WEBHOOK=${EMAIL_WEBHOOK}
      - PRODUCT_AGENT=${PRODUCT_AGENT}
      - JUMIA_SHIPPING=${JUMIA_SHIPPING}
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecommerce.rule=Host(`laniastores.toolsntuts.com`)"
      - "traefik.http.routers.ecommerce.entrypoints=websecure"
      - "traefik.http.routers.ecommerce.tls.certresolver=letsencrypt"
      - "traefik.http.services.ecommerce.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true